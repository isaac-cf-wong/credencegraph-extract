[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "credencegraph-extract"
authors = [{ name = "Isaac C. F. Wong" }]
description = "An automated analyst for credencegraph: provider calls recorded in run directories, replayed byte-identically"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "anthropic>=2.3.0",
    "credencegraph[ingest]>=0.3,<0.4",
]

[project.scripts]
credencegraph-extract = "credencegraph_extract.cli:app"

[project.urls]
Source = "https://github.com/isaac-cf-wong/credencegraph-extract"
Tracker = "https://github.com/isaac-cf-wong/credencegraph-extract/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/credencegraph_extract"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = "tests"

[tool.ruff]
line-length = 120
target-version = "py313"
lint.extend-select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "N",
  "B",
  "A",
  "C4",
  "PT",
  "RUF",
  "PL",
  "SIM",
  "T10",
  "D",
  "S",
]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004", "D103"]
